name: taskboard

services:
  # Database Service
  mongodb:
    image: mongo:7.0-jammy
    container_name: taskboard-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: taskboard
    volumes:
      - mongo_data:/data/db
    networks:
      - taskboard-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: taskboard-backend:local
    container_name: taskboard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      MONGODB_URI: mongodb://mongodb:27017/taskboard
      APP_VERSION: 1.0.0
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - taskboard-network

  # Frontend Service (Nginx reverse proxy + React SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: taskboard-frontend:local
    container_name: taskboard-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - taskboard-network

networks:
  taskboard-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
