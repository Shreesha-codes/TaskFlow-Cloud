apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskflow-cloud
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Shreesha-codes/TaskFlow-Cloud.git
    targetRevision: main
    path: helm/taskboard
    helm:
      releaseName: taskboard
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: taskboard
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
